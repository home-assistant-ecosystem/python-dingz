[project]
name = "dingz"
version = "0.6.0.dev0"
authors = [
    { name = "Fabian Affolter", email = "fabian@affolter-engineering.ch" },
]
description = "Python API for interacting with Dingz devices"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp<4",
    "async-timeout>=5.0.1 ; python_full_version < '3.11'",
    "click>=8.1.8",
    "setuptools>=80.9.0",
]

[project.urls]
Repository = "https://github.com/home-assistant-ecosystem/python-dingz"

[project.scripts]
dingz = "dingz.cli:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dingz"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.12.8",
]
